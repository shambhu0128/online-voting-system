<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

   
	
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<link rel="stylesheet" th:href="@{/css/bootstrap.css}" />
	<style>
    /* FORCE HOME PAGE UI (overrides bootstrap & style.css) */
    body section.center {
        background-color: #ffffff !important;
        padding: 80px !important;
        border-radius: 30px !important;
        box-shadow: 0 25px 60px rgba(0,0,0,0.35) !important;
        max-width: 900px !important;
        margin: 80px auto !important;
        text-align: center !important;
    }

    body section.center h1 {
        font-size: 52px !important;
        color: #1e90ff !important;
        font-weight: 700 !important;
        margin-bottom: 25px !important;
        text-shadow: 2px 2px 6px rgba(0,0,0,0.3) !important;
    }

    body section.center p {
        font-size: 22px !important;
        color: #444 !important;
        margin-bottom: 40px !important;
        line-height: 1.6 !important;
    }

    body section.center h3 {
        font-size: 20px !important;
        padding: 12px !important;
        border-radius: 10px !important;
        margin-top: 25px !important;
    }

    body section.center h3[style*="red"] {
        background-color: #ffe5e5 !important;
        border: 2px solid #dc3545 !important;
        color: #dc3545 !important;
        font-weight: bold !important;
    }

    body section.center:hover {
        transform: scale(1.03) !important;
        transition: 0.3s ease-in-out !important;
    }
</style>
	

    <title th:text="${title}">Title</title>
  </head>
  <body> 
   <!-- Navbar -->

  <ul>
  <li><a class="active" th:href="@{/user/}">Home</a></li>
   <li><a>Welcome <span th:text="${user.name}"></span></a></li>
  <li><a th:href="@{/logout}">Logout</a></li>
</ul>

    <!-- Navbar End -->
    
  
   
  
    <div th:replace="${content}">
    
    </div>
	
	  </div>
	
   
    
  
  
  
 
    
  </body>
</html>
